# Detect admin subdomain from Host header. Any hostname starting with "admin."
# is treated as the admin WMS; everything else is the storefront.
map $host $is_admin_host {
    default 0;
    "~^admin\." 1;
}

server {
    listen ${PORT};
    server_name _;

    # Runtime DNS resolution for the backend upstream.
    # Railway gives each service a private IP that CHANGES on every redeploy.
    # With a literal proxy_pass, nginx resolves the host ONCE at startup and
    # caches the (soon stale) IP -> 504 after the backend redeploys. Using a
    # variable in proxy_pass + this resolver forces per-request re-resolution.
    # ${NGINX_RESOLVER} is injected from /etc/resolv.conf by the entrypoint.
    resolver ${NGINX_RESOLVER} valid=10s;
    resolver_timeout 5s;

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied off;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # www.atsdtm.com.tr served the same site with a 200, so Google saw two copies of every
    # page and split ranking signals between them. One host; https because TLS ends at the
    # Railway edge and $scheme here is always http.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ─────────────────────────────────────────────────────────────
    # Legacy redirects (domain split migration)
    # ─────────────────────────────────────────────────────────────

    # Old /store/* URLs from the single-domain era:
    #   - On admin host → cross-redirect to the store host (strip /store)
    #   - On store host → strip /store, keep same host
    # 301 because these are permanent structural moves — SEO/link equity
    # preserved by browsers and search engines.
    location ~ ^/store(/.*)?$ {
        set $legacy_tail $1;
        if ($legacy_tail = "") { set $legacy_tail "/"; }
        if ($is_admin_host) {
            return 301 $scheme://${STORE_HOST}$legacy_tail$is_args$args;
        }
        return 301 $legacy_tail$is_args$args;
    }

    # Old admin login URL hit on the store host → bounce to admin subdomain.
    location = /login {
        if ($is_admin_host = 0) {
            return 301 $scheme://${ADMIN_HOST}/login;
        }
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────
    # SPA + API routing
    # ─────────────────────────────────────────────────────────────

    # sitemap.xml is generated dynamically by the backend (SitemapController).
    # Proxy it so Google Search Console can fetch atsdtm.com.tr/sitemap.xml
    # (otherwise the SPA catch-all returns index.html instead of the XML).
    location = /sitemap.xml {
        set $api_origin "${API_ORIGIN}";
        proxy_pass $api_origin/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Handle React Router.
    # ssi: index.html includes /__seo/head and /__seo/body for the requested URL (added
    # post-build by scripts/inject-ssi.js), so each storefront page arrives with its own
    # title, description, canonical and readable content instead of one shared shell.
    location / {
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
    }

    # Server-rendered SEO fragments — reachable only as SSI subrequests from index.html.
    # Every failure (backend down, slow, unknown URL) must end as an EMPTY body: that is
    # what makes nginx print the stub (the original static title). A non-empty error body
    # would be pasted into the page's <head> as-is, hence intercept + 204 below.
    location ~ ^/__seo/(?<seo_slot>head|body)(/.*)?$ {
        internal;
        # The admin panel is the same index.html; it keeps the static defaults.
        if ($is_admin_host) {
            return 204;
        }
        set $api_origin "${API_ORIGIN}";
        # $request_uri here is the PAGE's raw, still percent-encoded URI. The decoded
        # subrequest path would send "/kategori/çamasir-..." as raw UTF-8 bytes, which
        # Tomcat rejects with 400 — every category with a Turkish letter in its slug
        # would silently fall back to the static title.
        proxy_pass $api_origin/seo/$seo_slot$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        # A gzip-encoded body would be spliced into the HTML as binary.
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Short: the whole page waits on this. Past it the stub is served.
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 403 404 500 502 503 504 = @seo_fallback;
    }

    location @seo_fallback {
        return 204;
    }

    # Backward-compatible rewrite: /api/* -> /api/admin/* for existing frontend code
    # This catches calls like /api/stocks and rewrites them to /api/admin/stocks
    # MUST be before the /api/admin/ and /api/store/ blocks
    #
    # public/ is excluded because those paths are called by outside systems, not by this
    # SPA. Kargonomi's callback to /api/public/cargo/kargonomi/webhook was arriving at the
    # backend as /api/admin/public/cargo/kargonomi/webhook, which the admin chain refuses —
    # so the carrier's reachability check saw 403 and would not save the webhook at all.
    location ~ ^/api/(?!admin/|store/|public/|info)(.*)$ {
        # Build the rewritten upstream path inline (instead of `rewrite ... break`)
        # because variable proxy_pass requires the full URI to be specified.
        set $api_origin "${API_ORIGIN}";
        proxy_pass $api_origin/api/admin/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the latter APPENDS to whatever
        # the client sent, so a request carrying "X-Forwarded-For: 1.2.3.4" produced
        # "1.2.3.4, <real ip>" and any consumer reading the left-most entry saw an
        # attacker-chosen address. Overwriting means the header contains exactly one
        # value that nginx itself observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin API proxy to backend
    location /api/admin/ {
        set $api_origin "${API_ORIGIN}";
        proxy_pass $api_origin$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the latter APPENDS to whatever
        # the client sent, so a request carrying "X-Forwarded-For: 1.2.3.4" produced
        # "1.2.3.4, <real ip>" and any consumer reading the left-most entry saw an
        # attacker-chosen address. Overwriting means the header contains exactly one
        # value that nginx itself observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public API proxy to backend — inbound webhooks from carriers and payment providers.
    # Without this block the path is excluded from the rewrite above but matched by no
    # location at all, so it falls through to `try_files ... /index.html` and the caller
    # gets the SPA's HTML with a 200: a webhook that looks delivered and is silently lost.
    location /api/public/ {
        set $api_origin "${API_ORIGIN}";
        proxy_pass $api_origin$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the latter APPENDS to whatever
        # the client sent, so a request carrying "X-Forwarded-For: 1.2.3.4" produced
        # "1.2.3.4, <real ip>" and any consumer reading the left-most entry saw an
        # attacker-chosen address. Overwriting means the header contains exactly one
        # value that nginx itself observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Store API proxy to backend (e-commerce storefront)
    location /api/store/ {
        set $api_origin "${API_ORIGIN}";
        proxy_pass $api_origin$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the latter APPENDS to whatever
        # the client sent, so a request carrying "X-Forwarded-For: 1.2.3.4" produced
        # "1.2.3.4, <real ip>" and any consumer reading the left-most entry saw an
        # attacker-chosen address. Overwriting means the header contains exactly one
        # value that nginx itself observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public API proxy (health, info)
    location /api/info {
        set $api_origin "${API_ORIGIN}";
        proxy_pass $api_origin$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # The SPA's HTML document is served from HERE, not from Spring — so this is the
    # only place a CSP can reach the page that actually runs scripts. It used to be
    # commented out, which meant the carefully written backend policy only ever
    # applied to JSON responses and did nothing for XSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://connect.facebook.net https://static.hotjar.com https://script.hotjar.com https://www.clarity.ms https://static.iyzipay.com https://www.iyzico.com https://www.paytr.com https://kargonomi.com.tr; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://connect.facebook.net https://*.hotjar.com https://*.hotjar.io wss://*.hotjar.com https://www.clarity.ms https://api.iyzipay.com https://api.kargonomi.com.tr; frame-src 'self' https://www.iyzico.com https://static.iyzipay.com https://www.paytr.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.iyzipay.com https://sandbox-api.iyzipay.com https://www.paytr.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(self), usb=(), fullscreen=(self)" always;

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
