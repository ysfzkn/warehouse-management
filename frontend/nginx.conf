server {
    listen 80;
    server_name localhost;

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied off;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backward-compatible rewrite: /api/* -> /api/admin/* for existing frontend code
    # This catches calls like /api/stocks and rewrites them to /api/admin/stocks
    # MUST be before the /api/admin/ and /api/store/ blocks
    location ~ ^/api/(?!admin/|store/|info)(.*)$ {
        rewrite ^/api/(.*)$ /api/admin/$1 break;
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin API proxy to backend
    location /api/admin/ {
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Store API proxy to backend (e-commerce storefront)
    location /api/store/ {
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public API proxy (health, info)
    location /api/info {
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP disabled for development — enable in production via nginx/prod.conf
    # add_header Content-Security-Policy "..." always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
