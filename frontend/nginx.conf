# Detect admin subdomain from Host header. Any hostname starting with "admin."
# is treated as the admin WMS; everything else is the storefront.
map $host $is_admin_host {
    default 0;
    "~^admin\." 1;
}

server {
    listen 80;
    server_name _;

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied off;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # ─────────────────────────────────────────────────────────────
    # Legacy redirects (domain split migration)
    # ─────────────────────────────────────────────────────────────

    # Old /store/* URLs from the single-domain era:
    #   - On admin host → cross-redirect to the store host (strip /store)
    #   - On store host → strip /store, keep same host
    # 301 because these are permanent structural moves — SEO/link equity
    # preserved by browsers and search engines.
    location ~ ^/store(/.*)?$ {
        set $legacy_tail $1;
        if ($legacy_tail = "") { set $legacy_tail "/"; }
        if ($is_admin_host) {
            return 301 $scheme://${STORE_HOST}$legacy_tail$is_args$args;
        }
        return 301 $legacy_tail$is_args$args;
    }

    # Old admin login URL hit on the store host → bounce to admin subdomain.
    location = /login {
        if ($is_admin_host = 0) {
            return 301 $scheme://${ADMIN_HOST}/login;
        }
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────
    # SPA + API routing
    # ─────────────────────────────────────────────────────────────

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backward-compatible rewrite: /api/* -> /api/admin/* for existing frontend code
    # This catches calls like /api/stocks and rewrites them to /api/admin/stocks
    # MUST be before the /api/admin/ and /api/store/ blocks
    location ~ ^/api/(?!admin/|store/|info)(.*)$ {
        rewrite ^/api/(.*)$ /api/admin/$1 break;
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin API proxy to backend
    location /api/admin/ {
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Store API proxy to backend (e-commerce storefront)
    location /api/store/ {
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Public API proxy (health, info)
    location /api/info {
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP disabled for development — enable in production via nginx/prod.conf
    # add_header Content-Security-Policy "..." always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
