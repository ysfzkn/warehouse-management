upstream backend {
    server backend:8080;
}

# ============================================================
# Global compression — gzip + brotli (~%20 daha küçük JS/CSS)
# Brotli için nginx'in brotli modülü yüklü olmalı (openresty veya
# nginx-extras paketi). Yoksa brotli satırlarını yorum yapın; gzip
# yeterli olur.
# ============================================================
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml application/xml+rss
           application/font-woff application/font-woff2
           image/svg+xml application/manifest+json;

# brotli on;
# brotli_comp_level 6;
# brotli_min_length 1024;
# brotli_types text/plain text/css text/xml text/javascript
#              application/json application/javascript application/xml
#              application/font-woff application/font-woff2
#              image/svg+xml application/manifest+json;

# Rate limiting zones — store ve admin için ayrı
limit_req_zone $binary_remote_addr zone=store_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ======================================================================
# OPTION 1: Subdomain-Based Routing (Recommended for Production)
# admin.yourdomain.com / wms.yourdomain.com → WMS admin panel
# yourdomain.com                            → E-commerce storefront
# ======================================================================

# Redirect HTTP → HTTPS (production)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Redirect HTTP → HTTPS (uncomment for SSL)
# server {
#     listen 80;
#     server_name admin.yourdomain.com yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# --- Admin Subdomain: admin.yourdomain.com ---
server {
    listen 80;
    # listen 443 ssl http2;  # uncomment for SSL
    server_name admin.yourdomain.com;

    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /var/www/frontend/build;
    index index.html;

    # Admin API → backend
    location /api/admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy /api/* rewrites for admin frontend backward compat
    location ~ ^/api/(?!admin/|store/|info)(.*)$ {
        rewrite ^/api/(.*)$ /api/admin/$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE stream (admin real-time notifications)
    location /api/admin/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Public API info
    location /api/info {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}

# --- Storefront: yourdomain.com / www.yourdomain.com ---
server {
    listen 80 default_server;
    # listen 443 ssl http2 default_server;  # uncomment for SSL
    server_name yourdomain.com www.yourdomain.com _;

    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /var/www/frontend/build;
    index index.html;

    # Store API → backend
    location /api/store/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Payment callback (must be public, no auth)
    location /api/store/payment/callback {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public API info
    location /api/info {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://sandbox-api.iyzipay.com https://api.iyzipay.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://sandbox-api.iyzipay.com https://api.iyzipay.com; frame-src https://sandbox-api.iyzipay.com https://api.iyzipay.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# Health check
server {
    listen 8090;
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
