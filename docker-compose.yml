  # ============================================================
  # MinIO — self-hosted S3-compatible object storage
  # ============================================================
  # Why MinIO in dev:
  #   - 100% S3 API compatible → aynı kod prod'da AWS S3 / Cloudflare R2 /
  #     Backblaze B2 / DigitalOcean Spaces ile çalışır
  #   - Local'de ücretsiz, console UI on http://localhost:9001
  #
  # Initial setup:
  #   1. docker compose up -d minio minio-init
  #   2. Console: http://localhost:9001 (minioadmin / minioadmin)
  #   3. Bucket "warehouse-uploads" minio-init ile otomatik oluşturulur
  #   4. application-dev.properties: STORAGE_PROVIDER=s3
  #
  # Production: Cloudflare R2 önerilir (en ucuz, zero egress fee).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    networks:
      - warehouse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Bucket auto-create + assets/ public-read policy (logos, banners için)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - warehouse-network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/warehouse-uploads;
      mc anonymous set download local/warehouse-uploads/assets;
      echo 'MinIO ready: bucket=warehouse-uploads, console=http://localhost:9001';
      exit 0;
      "

  # ============================================================
  # Log aggregation — Grafana Loki + Promtail + Grafana
  # ============================================================
  # Ücretsiz, self-hosted, düşük kaynak (Loki idle <100 MB RAM).
  # Spring Boot JSON logs → Promtail tails Docker logs → Loki indexer
  # → Grafana LogQL query.
  #
  #   - Grafana: http://localhost:3001 (admin / admin)
  #   - Loki API: http://localhost:3100
  #
  # Quick start:
  #   docker compose up -d loki promtail grafana
  #   Backend loglarını Grafana'da Explore → Loki → {service="warehouse-backend"}
  loki:
    image: grafana/loki:2.9.10
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - warehouse-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docs/observability/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - warehouse-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/observability/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - loki
    networks:
      - warehouse-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production deployment)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - frontend
  #   networks:
  #     - warehouse-network
  #   restart: unless-stopped

networks:
  warehouse-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  loki_data:
  grafana_data:
