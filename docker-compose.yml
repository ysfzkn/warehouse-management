version: '3.8'

services:
  # PostgreSQL Database (with pgvector for Cezeri v2 RAG features)
  #
  # NOTE: we pin to pg15 to match any existing postgres_data volume created
  # by the old postgres:15-alpine image. If you start from a clean volume
  # you can bump to pg17 safely. Downgrading to vanilla postgres is also
  # fine — the V42 migration detects pgvector availability at runtime and
  # simply skips the vector-dependent tables; all other assistant features
  # keep working and RAG is just disabled.
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: secret123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - warehouse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
