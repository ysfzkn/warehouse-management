# Email / SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@example.com}
app.mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:http://localhost:3000}

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Counts cache configuration (in seconds and max entries)
app.cache.counts.ttl-seconds=5
app.cache.counts.max-size=100

# Small reference data cache (brands, colors, warehouses) to reduce DB reads during bursts
app.cache.refdata.ttl-seconds=60
app.cache.refdata.max-size=1000

# Hibernate Batch Processing Configuration
# Enable JDBC batch processing for better performance in bulk operations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# SSE connection timeout (milliseconds)
app.sse.timeout-ms=3600000

# Server Configuration
server.port=8080

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# Optional admin security code for destructive actions
app.admin.security-code=${ADMIN_SECURITY_CODE:12345}

# Default storage dir for Excel uploads (override per env if needed)
app.import.storage-dir=${IMPORT_STORAGE_DIR:uploads/stock-imports}

# Default storage dir for photo uploads (override per env if needed, e.g., /tmp/warehouse-uploads/shipments for Railway)
app.photo.base-dir=${PHOTO_STORAGE_DIR:uploads/shipments}

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.warehouse=INFO

# Timezone Configuration (Turkey GMT+3)
spring.jackson.time-zone=Europe/Istanbul
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul

# Default profile will be determined by SPRING_PROFILES_ACTIVE environment variable
# If not set, will default to 'dev' profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Payment Configuration
app.payment.provider=${PAYMENT_PROVIDER:IYZICO}
app.payment.sandbox=${PAYMENT_SANDBOX:true}
app.payment.iyzico.api-key=${IYZICO_API_KEY:}
app.payment.iyzico.secret-key=${IYZICO_SECRET_KEY:}
app.payment.iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
app.payment.iyzico.callback-url=${IYZICO_CALLBACK_URL:http://localhost:3000/store/odeme/callback}
app.payment.iyzico.timeout-minutes=${IYZICO_TIMEOUT_MINUTES:15}
app.payment.bank-transfer.deadline-hours=${BANK_TRANSFER_DEADLINE_HOURS:48}
app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:}
app.payment.bank-transfer.iban=${BANK_TRANSFER_IBAN:}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:}

# Google OAuth 2.0 Configuration
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
