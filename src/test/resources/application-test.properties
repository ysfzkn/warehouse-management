spring.datasource.url=jdbc:h2:mem:warehouse_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
spring.sql.init.mode=never
spring.test.database.replace=none

# DataInitializer admin user. PasswordPolicyValidator requires 8+ chars with an
# upper case letter and a digit, and now also rejects common passwords — which is
# why this is no longer "Admin1234".
app.admin.username=admin
app.admin.password=Test1234Secure
app.admin.security-code=12345
app.security.jwt-secret=test-secret-change-in-production-min-32-chars!!
# Storage tests: integration test'ler @SpringBootTest yaparken S3 bağlanmasın
storage.provider=local

# Disable Spring AI Azure OpenAI auto-configuration for tests (no API key needed).
# Spring AI 1.0.0 GA package: org.springframework.ai.model.azure.openai.autoconfigure
spring.autoconfigure.exclude=\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiChatAutoConfiguration,\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiImageAutoConfiguration,\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiAudioTranscriptionAutoConfiguration


# There is no proxy in front of the test server, so the loopback peer must NOT be
# treated as a trusted hop: deliberately narrowing internal-proxies to a range that
# 127.0.0.1 cannot match is what makes the spoofing test meaningful.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=203\.0\.113\.254
app.security.trusted-proxy-count=0
# Keep the catch-all bucket generous so it never masks the specific rule under test.
app.security.ratelimit.global-per-minute=5000
