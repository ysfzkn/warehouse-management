# Production Profile Configuration (PostgreSQL)

# Primary configuration using DATABASE_URL environment variable
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

#  JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${SPRING_FLYWAY_BASELINE_DESCRIPTION:Existing schema}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1100000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Server
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.web=WARN
logging.level.com.warehouse=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# Admin Identity
# Must
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.security-code=${ADMIN_SECURITY_CODE}

#  JWT
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.security.refresh-token-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Base URL (Frontend domain)
# Real Domain
app.base-url=${APP_BASE_URL}

# CORS
# Compulsory: Frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#  E-posta / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM}
app.mail.enabled=true

# Google OAuth 2.0
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

# Payment
app.payment.provider=${PAYMENT_PROVIDER:IYZICO}
app.payment.sandbox=false

# iyzico — API anahtarları, callback ve timeout ADMIN PANELİNDEN (DB: payment_gateway_config)
# yönetilir. Buradaki tek satır, DB'de aktif config yokken kullanılacak fallback'in
# PROD endpoint'e (sandbox değil) düşmesini garanti eder.
app.payment.iyzico.base-url=https://api.iyzipay.com

# Havale / EFT
app.payment.bank-transfer.deadline-hours=${BANK_TRANSFER_DEADLINE_HOURS:48}
app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:}
app.payment.bank-transfer.iban=${BANK_TRANSFER_IBAN:}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.import.storage-dir=${IMPORT_STORAGE_DIR:/data/uploads/imports}
app.photo.base-dir=${PHOTO_STORAGE_DIR:/data/uploads/shipments}

# ===========================
# Storage Local Dev = MinIO (docker-compose), Prod = Railway Bucket
# ===========================
# MinIO local: docker compose up -d minio minio-init
#   Console: http://localhost:9001 (minioadmin / minioadmin)
#   S3 API:  http://localhost:9000
#
# Railway prod: STORAGE_* env (endpoint, access key, secret, bucket).
storage.provider=${STORAGE_PROVIDER:s3}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT}
storage.s3.bucket=${STORAGE_S3_BUCKET}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.path-style=${STORAGE_S3_PATH_STYLE:true}
storage.s3.public-acl-supported=${STORAGE_S3_PUBLIC_ACL_SUPPORTED:true}
storage.s3.public-base-url=${STORAGE_S3_PUBLIC_BASE_URL:}

# ===========================
# Assistant (Cezeri WMS + Store) Spring AI + Azure OpenAI
# ===========================
# Required env vars:
# - AZURE_OPENAI_ENDPOINT
# - AZURE_OPENAI_API_KEY
# - AZURE_OPENAI_GPT51_DEPLOYMENT
# - AZURE_OPENAI_EMBEDDING_DEPLOYMENT  (new; e.g. text-embedding-3-small)
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_GPT51_DEPLOYMENT:}

# GPT-5.1: temperature is restricted (Azure returns 400 for non-default values).
spring.ai.azure.openai.chat.options.temperature=1

# Embedding model (RAG pipeline: product vectors + FAQ documents)
# To use a SEPARATE Azure resource for embedding, set these env vars.
# When empty, the main chat endpoint+key above are used automatically.
assistant.embedding.endpoint=${AZURE_OPENAI_EMBEDDING_ENDPOINT:}
assistant.embedding.api-key=${AZURE_OPENAI_EMBEDDING_API_KEY:}
assistant.embedding.deployment-name=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
spring.ai.azure.openai.embedding.options.deployment-name=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}

# Assistant cost tracking (USD per 1K tokens). Override via env vars for price changes.
assistant.cost.chat.prompt-per-1k-usd=${ASSISTANT_COST_CHAT_PROMPT_PER_1K:0.0025}
assistant.cost.chat.completion-per-1k-usd=${ASSISTANT_COST_CHAT_COMPLETION_PER_1K:0.010}
assistant.cost.embedding.per-1k-usd=${ASSISTANT_COST_EMBEDDING_PER_1K:0.00002}

# Vector store dimensions (must match the embedding model above)
assistant.rag.embedding-dimensions=1536
assistant.rag.vector-top-k=5
assistant.rag.vector-distance-threshold=0.35
assistant.rag.chunk-size-tokens=500
assistant.rag.chunk-overlap-tokens=50

# Max response tokens (GPT-5.1 uses max_completion_tokens, supported in Spring AI GA)
spring.ai.azure.openai.chat.options.max-completion-tokens=1500

# Safety pipeline
assistant.safety.input.max-length=4000
assistant.safety.input.pii-detection=true
assistant.safety.input.pii-action=REDACT
assistant.safety.input.jailbreak-detection=true
assistant.safety.output.pii-redaction=true
assistant.safety.output.hallucination-check=true
assistant.safety.log-sanitization=true

# Rate limits
assistant.ratelimit.guest-session-max=2
assistant.ratelimit.guest-ip-daily=10
assistant.ratelimit.customer-hourly=30
assistant.ratelimit.customer-daily=150
assistant.ratelimit.wms-hourly=60

# Production safety guards
invoice.mock-enabled=false

# Actuator hardening (only health+info public)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.git.enabled=false


# Swagger UI disabled in prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

