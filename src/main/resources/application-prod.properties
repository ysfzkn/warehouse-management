# Production Profile Configuration (PostgreSQL)
# Primary configuration using DATABASE_URL environment variable
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback configuration if DATABASE_URL is not available
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${SPRING_FLYWAY_BASELINE_DESCRIPTION:Existing schema}

# Connection Pool Configuration (Optimized for production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1100000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# PostgreSQL specific settings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration for Production
server.port=${PORT:8080}

# Production Logging (Less verbose)
logging.level.org.springframework.web=WARN
logging.level.com.warehouse=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG

# Admin credentials (override via Railway Variables)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# Writable location for Excel uploads (Railway allows /tmp)
app.import.storage-dir=${IMPORT_STORAGE_DIR:/data/uploads/imports}

# Writable location for photo uploads (Railway allows /tmp)
app.photo.base-dir=${PHOTO_STORAGE_DIR:/data/uploads/shipments}
