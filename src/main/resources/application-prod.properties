# Production Profile Configuration (PostgreSQL)

# Primary configuration using DATABASE_URL environment variable
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

#  JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${SPRING_FLYWAY_BASELINE_DESCRIPTION:Existing schema}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1100000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Server
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.web=WARN
logging.level.com.warehouse=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# Admin Identity
# Must
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.security-code=${ADMIN_SECURITY_CODE}

#  JWT
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.security.refresh-token-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Base URL (Frontend domain)
# Real Domain
app.base-url=${APP_BASE_URL}

# CORS
# Compulsory: Frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#  E-posta / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM}
app.mail.enabled=true

# Google OAuth 2.0
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Payment
app.payment.provider=${PAYMENT_PROVIDER:IYZICO}
app.payment.sandbox=false

# iyzico (Production keys)
app.payment.iyzico.api-key=${IYZICO_API_KEY:}
app.payment.iyzico.secret-key=${IYZICO_SECRET_KEY:}
app.payment.iyzico.base-url=https://api.iyzipay.com
app.payment.iyzico.callback-url=${IYZICO_CALLBACK_URL}
app.payment.iyzico.timeout-minutes=${IYZICO_TIMEOUT_MINUTES:15}

# Havale / EFT
app.payment.bank-transfer.deadline-hours=${BANK_TRANSFER_DEADLINE_HOURS:48}
app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:}
app.payment.bank-transfer.iban=${BANK_TRANSFER_IBAN:}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.import.storage-dir=${IMPORT_STORAGE_DIR:/data/uploads/imports}
app.photo.base-dir=${PHOTO_STORAGE_DIR:/data/uploads/shipments}

# ===========================
# Cezeri (Spring AI + Azure OpenAI)
# ===========================
# Required env vars:
# - AZURE_OPENAI_ENDPOINT
# - AZURE_OPENAI_API_KEY
# - AZURE_OPENAI_GPT51_DEPLOYMENT
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_GPT51_DEPLOYMENT:}

# GPT-5.1: temperature is restricted (Azure returns 400 for non-default values).
spring.ai.azure.openai.chat.options.temperature=1