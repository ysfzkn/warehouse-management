# Counts cache configuration (in seconds and max entries)
app.cache.counts.ttl-seconds=5
app.cache.counts.max-size=100

# Small reference data cache (brands, colors, warehouses) to reduce DB reads during bursts
app.cache.refdata.ttl-seconds=60
app.cache.refdata.max-size=1000

# SSE connection timeout (milliseconds)
app.sse.timeout-ms=3600000

# Server Configuration
server.port=8080

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# Default storage dir for Excel uploads (override per env if needed)
app.import.storage-dir=uploads/stock-imports

# Default storage dir for photo uploads (override per env if needed, e.g., /tmp/warehouse-uploads/shipments for Railway)
app.photo.base-dir=${PHOTO_STORAGE_DIR:uploads/shipments}

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.warehouse=INFO

# Timezone Configuration (Turkey GMT+3)
spring.jackson.time-zone=Europe/Istanbul
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul

# Default profile will be determined by SPRING_PROFILES_ACTIVE environment variable
# If not set, will default to 'dev' profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
