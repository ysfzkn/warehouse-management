# COMMON CONFIGURATION application.properties

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${PORT:8080}

# Trust X-Forwarded-* headers from the Railway / nginx edge proxy so generated URLs
# (email links, payment callbacks) use https:// instead of http://
#
# NATIVE, not FRAMEWORK. Spring's ForwardedHeaderFilter (the "framework" strategy)
# believes X-Forwarded-For unconditionally and takes its left-most entry — which is
# whatever the client typed. That made getRemoteAddr() itself attacker-controlled, so
# every brute-force counter, rate limit and audit log could be steered by a header.
# Tomcat's RemoteIpValve ("native") instead walks the list from the right and only
# accepts hops that match internal-proxies, stopping at the first address that was not
# vouched for by a trusted proxy.
server.forward-headers-strategy=native
# Private + carrier-grade-NAT ranges: the addresses an edge proxy legitimately
# connects from. Override with SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to add
# another trusted range (a Cloudflare range, for instance).
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]\\.\\d{1,3}\\.\\d{1,3}|100\\.6[4-9]\\.\\d{1,3}\\.\\d{1,3}|100\\.[7-9][0-9]\\.\\d{1,3}\\.\\d{1,3}|100\\.1[0-1][0-9]\\.\\d{1,3}\\.\\d{1,3}|100\\.12[0-7]\\.\\d{1,3}\\.\\d{1,3}
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Virtual Threads (Java 21) - boosts I/O-bound work (payment callbacks, SMTP, outbound HTTP)
spring.threads.virtual.enabled=true

# E-posta / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@example.com}
app.mail.enabled=${MAIL_ENABLED:false}

# Base URL
app.base-url=${APP_BASE_URL:http://localhost:3000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Dosya Yükleme
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Cache
app.cache.counts.ttl-seconds=5
app.cache.counts.max-size=100
app.cache.refdata.ttl-seconds=60
app.cache.refdata.max-size=1000

# Hibernate Batch
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# SSE
app.sse.timeout-ms=3600000

# Admin
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}
app.admin.security-code=${ADMIN_SECURITY_CODE:12345}

# JWT
app.security.jwt-secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
# Bound to SecurityProperties.jwtExpirationHours. Until this had a matching field,
# JWT_EXPIRATION_HOURS was silently discarded and every admin token lived 8 hours.
app.security.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.security.refresh-token-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.security.customer-token-expiration-days=${CUSTOMER_TOKEN_EXPIRATION_DAYS:7}

# Column-level encryption (tc_kimlik_no, payment gateway credentials).
# base64, 32 bytes:  openssl rand -base64 32
# When empty the key is derived from JWT_SECRET, so encryption is always on; set a
# dedicated key so the JWT secret can be rotated without re-encrypting the database.
app.security.encryption-key=${APP_ENCRYPTION_KEY:}

# Extra X-Forwarded-For handling on top of Tomcat's RemoteIpValve (above), which has
# already produced a trustworthy getRemoteAddr(). Leave at 0 unless the app sits behind
# a proxy that the valve cannot classify; then set it to the number of trusted hops and
# the resolver counts that many entries from the RIGHT of the header.
app.security.trusted-proxy-count=${TRUSTED_PROXY_COUNT:0}

# Catch-all per-IP request ceiling for /api/** (per minute). 0 disables it.
app.security.ratelimit.global-per-minute=${RATELIMIT_GLOBAL_PER_MINUTE:600}

# Admin/store host allowlist. When set (and the prod profile is active) admin
# endpoints are only reachable on the admin host, which is what stops an XSS on the
# storefront from calling /api/admin/**. Leaving these empty disables the check.
app.hosts.admin=${APP_HOSTS_ADMIN:}
app.hosts.store=${APP_HOSTS_STORE:}

# File Upload
app.import.storage-dir=${IMPORT_STORAGE_DIR:uploads/stock-imports}
app.photo.base-dir=${PHOTO_STORAGE_DIR:uploads/shipments}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.warehouse=INFO

# AI assistant observability — tool calls, RAG retrieval, chunking, embedding.
# Set the following to DEBUG to see per-chunk / per-hit detail; INFO is the summary level.
logging.level.CezeriTool=INFO
logging.level.com.warehouse.assistant.core.rag=INFO
logging.level.com.warehouse.assistant.admin.service.AssistantDocumentService=INFO
logging.level.com.warehouse.assistant.core.observability=INFO
logging.level.com.warehouse.assistant.core.config.AssistantFlagsService=INFO

# Timezone (Turkey GMT+3)
spring.jackson.time-zone=Europe/Istanbul
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul

# Payment
app.payment.provider=${PAYMENT_PROVIDER:IYZICO}
app.payment.sandbox=${PAYMENT_SANDBOX:true}
app.payment.iyzico.api-key=${IYZICO_API_KEY:}
app.payment.iyzico.secret-key=${IYZICO_SECRET_KEY:}
app.payment.iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
app.payment.iyzico.callback-url=${IYZICO_CALLBACK_URL:http://localhost:8080/api/store/payment/callback}
app.payment.iyzico.timeout-minutes=${IYZICO_TIMEOUT_MINUTES:15}
app.payment.bank-transfer.deadline-hours=${BANK_TRANSFER_DEADLINE_HOURS:48}
app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:}
app.payment.bank-transfer.iban=${BANK_TRANSFER_IBAN:}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:}

# Google OAuth
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

# Actuator
# The mail server is a non-critical dependency: SMTP being briefly unreachable must not
# make /actuator/health report DOWN, because that is the path the platform uses as its
# container health check and a 503 there triggers a restart or a failed deploy.
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# /actuator/info is public; exposing environment-derived values there is an
# unnecessary disclosure channel.
management.info.env.enabled=false

# AI / LLM
# We build chat / embedding clients dynamically at runtime via DynamicChatModelProvider and
# EmbeddingService (config from site_settings / admin UI). Spring AI's Azure auto-config is
# disabled here to avoid boot-time crashes when AZURE_OPENAI_ENDPOINT is empty. Spring AI 1.0
# supports these "disable" properties plus we also exclude the auto-configuration classes
# themselves (belt-and-suspenders shared client-builder is @Imported by sibling configs).
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.autoconfigure.exclude=\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiChatAutoConfiguration,\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiImageAutoConfiguration,\
  org.springframework.ai.model.azure.openai.autoconfigure.AzureOpenAiAudioTranscriptionAutoConfiguration


#  Resilience4j retry/circuit breaker (Iyzico, Logo, Kargonomi)
resilience4j.retry.instances.iyzico.max-attempts=3
resilience4j.retry.instances.iyzico.wait-duration=1s
resilience4j.retry.instances.iyzico.exponential-backoff-multiplier=2
resilience4j.retry.instances.iyzico.retry-exceptions=java.io.IOException,java.net.SocketTimeoutException

resilience4j.retry.instances.kargonomi.max-attempts=3
resilience4j.retry.instances.kargonomi.wait-duration=2s
resilience4j.retry.instances.kargonomi.exponential-backoff-multiplier=2
resilience4j.retry.instances.kargonomi.retry-exceptions=java.io.IOException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

resilience4j.retry.instances.logo-efatura.max-attempts=2
resilience4j.retry.instances.logo-efatura.wait-duration=3s
resilience4j.retry.instances.logo-efatura.retry-exceptions=java.io.IOException

resilience4j.circuitbreaker.instances.iyzico.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.iyzico.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.iyzico.sliding-window-size=10
resilience4j.circuitbreaker.instances.iyzico.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.kargonomi.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.kargonomi.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.kargonomi.sliding-window-size=10
resilience4j.circuitbreaker.instances.kargonomi.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.logo-efatura.failure-rate-threshold=70
resilience4j.circuitbreaker.instances.logo-efatura.wait-duration-in-open-state=120s
resilience4j.circuitbreaker.instances.logo-efatura.sliding-window-size=5
resilience4j.circuitbreaker.instances.logo-efatura.minimum-number-of-calls=3


# Provider: hcaptcha veya recaptcha
captcha.enabled=${CAPTCHA_ENABLED:false}
captcha.provider=${CAPTCHA_PROVIDER:hcaptcha}
captcha.secret=${CAPTCHA_SECRET:}
# Behaviour when the CAPTCHA provider is unreachable. false = reject (default):
# an attacker must not be able to disable CAPTCHA by knocking the provider over.
captcha.fail-open=${CAPTCHA_FAIL_OPEN:false}


# ============================================================
# Springdoc OpenAPI / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
#   springdoc.swagger-ui.enabled=false


# ============================================================
# Object storage provider: "local" (filesystem) | "s3" (S3-compatible)
# Status: FULLY IMPLEMENTED.
#   - "local" LocalPhotoStorageService (filesystem, dev default)
#   - "s3"    S3PhotoStorageService (MinIO, AWS S3, Cloudflare R2)
# Activation:
#   1. docker compose up -d minio minio-init    (dev) or use real S3 in prod
#   2. STORAGE_PROVIDER=s3
#   3. Fill credentials below (defaults match the MinIO docker-compose service)
# See docs/STORAGE_MINIO.md for the full setup guide.
storage.provider=${STORAGE_PROVIDER:local}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
storage.s3.bucket=${STORAGE_S3_BUCKET:warehouse-uploads}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:minioadmin}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
# MinIO + R2 + Oracle path-style ister; AWS S3 her ikisini de destekler.
storage.s3.path-style=${STORAGE_S3_PATH_STYLE:true}
# Public asset URL'leri (R2 custom domain veya Oracle PAR base).
storage.s3.public-base-url=${STORAGE_S3_PUBLIC_BASE_URL:}
# Public-read ACL. MinIO/AWS/R2/B2 true (default).
# Oracle Object Storage ACL'i desteklemez STORAGE_S3_PUBLIC_ACL_SUPPORTED=false.
storage.s3.public-acl-supported=${STORAGE_S3_PUBLIC_ACL_SUPPORTED:true}


# ============================================================
# OpenTelemetry distributed tracing
# Status: PLACEHOLDER ONLY no Spring beans use these values yet.
# Activation path is via the OTel Java agent (zero code changes):
#   1) Download opentelemetry-javaagent.jar
#   2) Pass at JVM startup:
#        -javaagent:/opt/agents/opentelemetry-javaagent.jar
#        -Dotel.service.name=warehouse-backend
#        -Dotel.exporter.otlp.endpoint=https://your-collector:4317
#        -Dotel.traces.sampler.arg=0.1
#   3) Point OTEL_ENABLED=true so dashboards / health checks can read state.
# Backend code paths are unchanged regardless of this flag.
# See docs/OBSERVABILITY.md for collector setup.
# ============================================================
otel.enabled=${OTEL_ENABLED:false}
otel.service-name=${OTEL_SERVICE_NAME:warehouse-backend}
otel.endpoint=${OTEL_ENDPOINT:}
otel.sampling-rate=${OTEL_SAMPLING:0.1}


# ============================================================
# DB Read Replica
# Status: PLACEHOLDER ONLY no routing data source is configured.
# Replica URL is currently ignored; all reads/writes go to the primary
# DataSource. To activate, a Spring AbstractRoutingDataSource bean and
# @Transactional(readOnly=true) routing logic must be added.
# See docs/OBSERVABILITY.md for the implementation outline.
# ============================================================
spring.datasource.replica.url=${DATABASE_REPLICA_URL:}
spring.datasource.replica.username=${DATABASE_REPLICA_USER:}
spring.datasource.replica.password=${DATABASE_REPLICA_PASSWORD:}

