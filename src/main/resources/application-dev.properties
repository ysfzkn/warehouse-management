# Development Profile Configuration (PostgreSQL)
# Primary configuration using DATABASE_URL environment variable
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stock_management}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback configuration if DATABASE_URL is not available
spring.datasource.username=${DB_USERNAME:keycloak}
spring.datasource.password=${DB_PASSWORD:password}

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${SPRING_FLYWAY_BASELINE_DESCRIPTION:Existing schema}

# Connection Pool Configuration (Optimized for production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1100000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# PostgreSQL specific settings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration for Production
server.port=${PORT:8080}

# Production Logging (Less verbose)
logging.level.org.springframework.web=WARN
logging.level.com.warehouse=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG

# Admin credentials (override via Railway Variables)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

app.security.jwt-secret=secret123


# ===========================
# Cezeri AI Provider Selection
# ===========================
# AI_PROVIDER environment variable
# - "ollama"
# - "azure"
app.ai.provider=${AI_PROVIDER:ollama}

# Exclude Azure OpenAI auto-configuration when using Ollama
# This prevents bean creation errors when Azure OpenAI credentials are not provided
# When AI_PROVIDER=azure, this exclude will be overridden by setting the property to empty
spring.autoconfigure.exclude=${AZURE_OPENAI_EXCLUDE:org.springframework.ai.autoconfigure.azure.openai.AzureOpenAiAutoConfiguration}

# ===========================
# Azure OpenAI Configuration
# ===========================
# Only configured when AI_PROVIDER=azure
# Required env vars when AI_PROVIDER=azure:
# - AZURE_OPENAI_ENDPOINT
# - AZURE_OPENAI_API_KEY
# - AZURE_OPENAI_GPT51_DEPLOYMENT
# Note: When AI_PROVIDER=ollama, these properties should be left empty
# Spring AI auto-configuration will skip bean creation if properties are empty
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_GPT51_DEPLOYMENT:}
spring.ai.azure.openai.chat.options.temperature=1

# ===========================
# Ollama Configuration
# ===========================
# Required env vars when AI_PROVIDER=ollama:
# - OLLAMA_BASE_URL (default: http://localhost:11434)
# - OLLAMA_MODEL (default: llama3.1)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.1}
spring.ai.ollama.chat.options.temperature=0.7

# Helpful diagnostics
logging.level.org.springframework.ai=DEBUG
logging.level.com.ollama=INFO
logging.level.com.azure=INFO