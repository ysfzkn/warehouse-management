# DEV

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stock_management}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:keycloak}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${SPRING_FLYWAY_BASELINE_DESCRIPTION:Existing schema}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1100000
spring.datasource.hikari.connection-timeout=20000

# Server
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.warehouse=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=DEBUG

# Admin Identity
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}
app.admin.security-code=${ADMIN_SECURITY_CODE:12345}

# JWT
app.security.jwt-secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
app.security.jwt-expiration-hours=${JWT_EXPIRATION_HOURS:24}
app.security.refresh-token-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Base URL (Frontend)
app.base-url=${APP_BASE_URL:http://localhost:3000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# E-posta / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@example.com}
app.mail.enabled=${MAIL_ENABLED:true}

#  Google OAuth 2.0
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

# Payment
app.payment.provider=${PAYMENT_PROVIDER:IYZICO}
app.payment.sandbox=${PAYMENT_SANDBOX:true}

# iyzico
app.payment.iyzico.api-key=${IYZICO_API_KEY:}
app.payment.iyzico.secret-key=${IYZICO_SECRET_KEY:}
app.payment.iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
app.payment.iyzico.callback-url=${IYZICO_CALLBACK_URL:http://localhost:8080/api/store/payment/callback}
app.payment.iyzico.timeout-minutes=${IYZICO_TIMEOUT_MINUTES:15}

# Havale / EFT
app.payment.bank-transfer.deadline-hours=${BANK_TRANSFER_DEADLINE_HOURS:48}
app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:}
app.payment.bank-transfer.iban=${BANK_TRANSFER_IBAN:}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:}

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.import.storage-dir=${IMPORT_STORAGE_DIR:uploads/stock-imports}
app.photo.base-dir=${PHOTO_STORAGE_DIR:uploads/shipments}


# ===========================
# Cezeri (Spring AI + Azure OpenAI)
# ===========================
# Required env vars:
# - AZURE_OPENAI_ENDPOINT
# - AZURE_OPENAI_API_KEY
# - AZURE_OPENAI_GPT51_DEPLOYMENT
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_GPT51_DEPLOYMENT:}


# GPT-5.1: temperature is restricted (Azure returns 400 for non-default values).
spring.ai.azure.openai.chat.options.temperature=1

# Helpful diagnostics when Azure calls fail
logging.level.org.springframework.ai=DEBUG
logging.level.com.azure=INFO