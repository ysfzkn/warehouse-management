# Docker Compose Profile Configuration
# Used when SPRING_PROFILES_ACTIVE=docker (set by docker-compose.yml)

# Database — connects to the 'db' service in docker-compose
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/warehouse_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:warehouse_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.warehouse=INFO
logging.level.org.hibernate.SQL=WARN

# JWT (override in production)
app.security.jwt-secret=${JWT_SECRET:docker-dev-secret-change-in-production}
