name: Quality Gates

# Test + lint + bundle bütçesi. Deploy YOK.
#
# Deploy'u Railway kendi GitHub entegrasyonuyla yapıyor. Buradaki `railway up` adımı
# quality gate'i hiç geçemediği için bugüne dek çalışmamıştı; gate düzeltilince ilk kez
# çalıştı ve RAILWAY_TOKEN olmadığı için düştü. İki ayrı deploy yolu tutmak aynı commit'i
# iki kez deploy etme riski demek, o yüzden bu adım kaldırıldı — kapılar (test, lint,
# bundle bütçesi) aynen duruyor.
#
# CI üzerinden deploy'a dönmek isterseniz: RAILWAY_TOKEN secret'ını ekleyip bir deploy
# job'ı geri koyun ve Railway tarafındaki otomatik deploy'u kapatın.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────────────────────────
  # Quality Gates — testler ve linting; PR'da da çalışır.
  # ────────────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # ── Backend ──
      - name: Backend tests
        # Maven Central paylaşımlı runner IP'lerine ara sıra 403/5xx döndürür;
        # wagon retry handler ile geçici ağ hatalarını otomatik tekrar dene.
        run: mvn -B -Dmaven.wagon.http.retryHandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 clean test

      - name: Backend Flyway validate (offline check, no DB)
        run: |
          # Migration dosyalarının syntax ve naming kontrolü
          # Gerçek validate için DB gerekir; burada sadece dosya listesini doğrularız.
          find src/main/resources/db/migration -name "V*.sql" -print | sort -V | tail -10
          echo "Migration files looked good."

      # ── Frontend ──
      - name: Frontend install
        run: cd frontend && npm ci

      - name: Frontend lint
        run: cd frontend && (npm run lint --if-present || echo "No lint script configured, skipping")

      - name: Frontend tests (non-blocking if missing)
        run: cd frontend && (npm test -- --watchAll=false --passWithNoTests || true)

      - name: Frontend build
        run: cd frontend && CI=false npm run build
        # CI=false: warnings'i error'a çevirmesin (CRA default'u true)

      - name: Bundle size budget (hard fail)
        run: |
          cd frontend/build/static/js
          # Bundle budget'ları (Faz 3 NICE-TO-HAVE):
          #   main.js raw: <= 2MB (gzip sonrası ~600KB hedef)
          #   tüm .js toplam raw: <= 6MB
          MAX_MAIN_BYTES=2097152      # 2 MB
          MAX_TOTAL_BYTES=6291456     # 6 MB

          MAIN_BUNDLE=$(ls -1 main*.js 2>/dev/null | head -1)
          if [ -z "$MAIN_BUNDLE" ]; then
            echo "❌ Main bundle bulunamadı"; exit 1
          fi
          MAIN_SIZE=$(stat -c%s "$MAIN_BUNDLE" 2>/dev/null || stat -f%z "$MAIN_BUNDLE" 2>/dev/null)
          echo "📦 Main bundle: $MAIN_BUNDLE = $MAIN_SIZE bytes (limit: $MAX_MAIN_BYTES)"
          if [ "$MAIN_SIZE" -gt "$MAX_MAIN_BYTES" ]; then
            echo "❌ FAIL: Main bundle $MAIN_SIZE > limit $MAX_MAIN_BYTES bytes."
            echo "   Code-splitting (React.lazy) ile böl veya bağımlılıkları azalt."
            exit 1
          fi
          TOTAL_SIZE=$(du -bc *.js 2>/dev/null | tail -1 | awk '{print $1}')
          if [ -z "$TOTAL_SIZE" ]; then
            TOTAL_SIZE=$(find . -name '*.js' -exec stat -f%z {} \; | awk '{s+=$1} END {print s}')
          fi
          echo "📦 Tüm JS toplam: $TOTAL_SIZE bytes (limit: $MAX_TOTAL_BYTES)"
          if [ "$TOTAL_SIZE" -gt "$MAX_TOTAL_BYTES" ]; then
            echo "❌ FAIL: Toplam JS $TOTAL_SIZE > limit $MAX_TOTAL_BYTES bytes."
            exit 1
          fi
          echo "✅ Bundle budget OK"
